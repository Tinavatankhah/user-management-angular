<div>
  <table>
    <tr>
      <th>#</th>
      <th>نام و نام خانوادگی</th>
      <th>ایمیل</th>
      <th>نقش</th>
      <th>وضعیت</th>
      <th>عملیات</th>
    </tr>

    @for (user of sortedUsers; track user.id; let index = $index) {
      @if (user.show) {
        <tr>
          <td>{{ $index + 1 }}</td>
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.status }}</td>
          <td><app-buttons [user]="user" [sorted]="sortedUsers"></app-buttons></td>
        </tr>
      }
    }
  </table>
</div>
