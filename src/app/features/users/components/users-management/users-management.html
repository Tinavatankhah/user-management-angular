<div class="container">
  <div class="top">
    <div>
      <h2>فهرست کاربران</h2>
      <p>مشاهده،جستجو و مدیریت کاربران سیستم</p>
    </div>
    <button (click)="router.navigate(['users/add'])">
      <span class="plus">+</span>
      <p>افزودن کاربر جدید</p>
    </button>
  </div>
  <div class="filter-search-container">
   <div class="search-container"><input
      type="text"
      placeholder="جستجوی کاربر (نام،ایمیل و...)"
      class="search"
      [(ngModel)]="search"
      (change)="change()"
    />
    <button (click)="change()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
</svg>
</button></div> 
    <select name="sort" [(ngModel)]="sort" (change)="change()">
      <option value="">همه نقش ها</option>
      <option value="مدیر سیستم">مدیر سیستم</option>
      <option value="کاربر عادی">کاربر عادی</option>
      <option value="اپراتور">اپراتور</option>
    </select>
  </div>

  <app-users-list [sortedUsers]="SortData"></app-users-list>
  <button class="show-hidden" (click)="showHidden()">
    <p>نمایش ایتم های مخفی شده</p>
  </button>
</div>
